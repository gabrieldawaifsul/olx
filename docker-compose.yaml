services:
  php:
    depends_on:
      - mysql
    build: .
    ports:
      - ${APACHE_PORT}:${APACHE_PORT}
    volumes:
      - .:/var/www/html
    networks:
      - rede
    restart: always
    tty: true  
  mysql:
    image: mysql:latest
    ports:
      - ${MYSQL_PORT}:${MYSQL_PORT}
    volumes:
      - db-data:/var/lib/mysql
      - ./src/scripts/init.sql:/docker-entrypoint-initdb.d/1.sql
    environment: 
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - rede
    restart: always

volumes:
  web-data:
  db-data:
    driver: local

networks:
  rede:
    driver: bridge
