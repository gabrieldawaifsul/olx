services:
  php:
    depends_on:
      - mysql
    build: .
    ports:
      - 80:80
    volumes:
      - .:/var/www/html
    networks:
      - rede
    restart: always
    tty: true  
  mysql:
    image: mysql:latest
    ports:
      - 3306:3306
    volumes:
      - db-data:/var/lib/mysql
      - ./src/scripts/init.sql:/docker-entrypoint-initdb.d/1.sql
    environment: 
      MYSQL_ROOT_PASSWORD: yes
      MYSQL_DATABASE: olx-db
    networks:
      - rede
    restart: always

volumes:
  db-data:
    driver: local

networks:
  rede:
    driver: bridge
